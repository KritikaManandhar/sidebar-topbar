<svg width="400" height="220" viewBox="0 0 400 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="220" fill="#2E4A62"/>
  <!-- Sky -->
  <rect width="400" height="120" fill="url(#sky-grad)"/>
  <!-- Mountains back -->
  <path d="M-20 130L80 40L180 120L300 30L420 130H-20Z" fill="#3D5A73" opacity="0.7"/>
  <path d="M80 40L100 65L70 70L80 40Z" fill="#E2E8F0" opacity="0.6"/>
  <path d="M300 30L325 60L290 65L300 30Z" fill="#E2E8F0" opacity="0.6"/>
  <!-- Trees/hills front -->
  <path d="M-20 220C50 180 120 150 200 160C280 170 350 140 420 150V220H-20Z" fill="#1E3725"/>
  <path d="M30 140L45 180H15L30 140Z" fill="#14291A"/>
  <path d="M60 130L78 175H42L60 130Z" fill="#1D3B26"/>
  <path d="M320 135L340 180H300L320 135Z" fill="#1D3B26"/>
  <!-- Hiker representation -->
  <g transform="translate(180, 110)">
    <!-- Backpack -->
    <rect x="2" y="16" width="14" height="22" rx="4" fill="#C2410C"/>
    <!-- Body -->
    <path d="M12 18L18 36L14 55" stroke="#E11D48" stroke-width="6" stroke-linecap="round"/>
    <path d="M14 36L8 54" stroke="#1E293B" stroke-width="5" stroke-linecap="round"/>
    <path d="M18 36L24 55" stroke="#1E293B" stroke-width="5" stroke-linecap="round"/>
    <!-- Head -->
    <circle cx="16" cy="10" r="6" fill="#FDBA74"/>
    <!-- Hair/Cap -->
    <path d="M10 8C10 5 13 3 17 3C21 3 23 6 22 10" fill="#78350F"/>
    <!-- Trekking pole -->
    <line x1="26" y1="20" x2="30" y2="58" stroke="#94A0B4" stroke-width="2"/>
  </g>
  <defs>
    <linearGradient id="sky-grad" x1="200" y1="0" x2="200" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#475569"/>
      <stop offset="1" stop-color="#94A3B8"/>
    </linearGradient>
  </defs>
</svg>
